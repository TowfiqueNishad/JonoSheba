# Jonoshheba AI — Nginx Reverse Proxy Template (dev/staging reference)
# Production TLS, strict CSP, and rate-limiting hardened in Phase 17.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript application/problem+json;

  upstream web_upstream   { server host.docker.internal:3000; }
  upstream admin_upstream { server host.docker.internal:3001; }
  upstream api_upstream   { server host.docker.internal:4000; }

  server {
    listen 80;
    server_name localhost;

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      proxy_pass http://admin_upstream;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
    }
  }
}
