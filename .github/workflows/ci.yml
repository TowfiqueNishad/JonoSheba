name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-ts:
    name: TypeScript Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  python-ai:
    name: Python AI Service (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy typecheck
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest

  security-audit:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm dependency audit
        run: pnpm audit --audit-level=high || true

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Python pip-audit
        working-directory: apps/ai
        run: |
          uv sync
          uvx pip-audit || true

  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs: [js-ts, python-ai]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: workers
            context: .
            dockerfile: apps/workers/Dockerfile
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: admin
            context: .
            dockerfile: apps/admin/Dockerfile
          - name: ai
            context: apps/ai
            dockerfile: apps/ai/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
